
services:
  postgres:
    image: postgres:17
    container_name: request_app_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: request_app
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d request_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
