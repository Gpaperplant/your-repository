name: EnerCal cleanup verification

on:
  push:
    branches:
      - cleanup/enercal-upload-review-2026-11

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python and dependencies
        run: |
          uv python install 3.14
          uv sync --locked
      - name: Compile refactored modules
        run: |
          uv run python -m py_compile enercal/enercal_review.py enercal/enercal_upload.py services/enercal_review_repository.py services/enercal_repository.py
      - name: Run independent regression tests
        run: |
          uv run python -m unittest discover -s tests -p 'test_enercal_specs.py' -v
          uv run python -m unittest discover -s tests -p 'test_mod_database.py' -v
          uv run python -m unittest discover -s tests -p 'test_enercal_reporting_page.py' -v
          uv run python -m unittest discover -s tests -p 'test_iso_import.py' -v

      - name: Package cleaned files
        uses: actions/upload-artifact@v4
        with:
          name: enercal-upload-review-cleanup-files
          path: |
            enercal/enercal_review.py
            enercal/enercal_upload.py
            services/enercal_review_repository.py
            services/enercal_repository.py
            tests/test_enercal_specs.py
            tests/test_mod_database.py
          if-no-files-found: error
